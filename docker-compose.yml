services:
  api:
    build:
      context: .
      dockerfile: src/RaceDay.Api/Dockerfile
    ports:
      - "5088:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  mvc:
    build:
      context: .
      dockerfile: src/RaceDay.Mvc/Dockerfile
    ports:
      - "5090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Update this to match how your MVC app reads the API URL. 
      # 'http://api:8080' uses Docker's internal network.
      - ApiSettings__BaseUrl=http://api:8080/ 
    depends_on:
      - api
