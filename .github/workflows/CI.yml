name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln -c Release --no-restore

      # No test projects exist yet. Once you add one, this step will run it.
      - name: Test
        run: dotnet test RaceDay.sln -c Release --no-build --verbosity normal

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          check() {
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              if [ "$code" = "200" ]; then echo "OK  $1"; return 0; fi
              sleep 2
            done
            echo "FAIL $1 (last status: $code)"; return 1
          }
          check http://localhost:5090/
          check http://localhost:5088/swagger/v1/swagger.json

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
